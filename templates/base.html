<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Task Manager{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
{% if session.user_id %}
<nav class="navbar navbar-dark bg-primary px-4 py-2">
<span class="navbar-brand fw-bold">Task Manager</span>
<div class="d-flex gap-3 align-items-center">
<span class="text-white">{{ session.username }}</span>
<a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-sm">Dang xuat</a>
</div>
</nav>
{% endif %}
<div class="container py-4">
{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}{% for cat, msg in messages %}
<div class="alert alert-{{ cat }}">{{ msg }}</div>
{% endfor %}{% endif %}{% endwith %}
{% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

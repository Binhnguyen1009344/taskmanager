{% extends 'base.html' %}
{% block title %}Them cong viec{% endblock %}
{% block content %}
<div class="row justify-content-center">
<div class="col-md-6">
<div class="card p-4">
<h5 class="mb-4">Them cong viec moi</h5>
<form method="POST">
<div class="mb-3">
<label class="form-label">Tieu de *</label>
<input type="text" name="title" class="form-control" required autofocus>
</div>
<div class="mb-3">
<label class="form-label">Mo ta</label>
<textarea name="description" class="form-control" rows="3"></textarea>
</div>
<div class="mb-4">
<label class="form-label">Do uu tien</label>
<select name="priority" class="form-select">
<option value="low">Thap</option>
<option value="medium" selected>Trung binh</option>
<option value="high">Cao</option>
</select>
</div>
<div class="d-flex gap-2">
<button type="submit" class="btn btn-primary">Luu</button>
<a href="{{ url_for('tasks') }}" class="btn btn-outline-secondary">Huy</a>

</div>
</form>
</div>
</div>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block title %}Dang nhap{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
<div class="col-md-4">
<div class="card p-4">
<h4 class="text-center mb-4">Task Manager</h4>
<form method="POST">
<div class="mb-3">
<label class="form-label">Ten dang nhap</label>
<input type="text" name="username" class="form-control" required autofocus>
</div>
<div class="mb-3">
<label class="form-label">Mat khau</label>
<input type="password" name="password" class="form-control" required>
</div>
<button type="submit" class="btn btn-primary w-100">Dang nhap</button>
</form>
<p class="text-center mt-3">Chua co tai khoan? <a href="{{ url_for('register') }}">Dang ky</a></p>
</div>
</div>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block title %}Sua cong viec{% endblock %}
{% block content %}
<div class="row justify-content-center">
<div class="col-md-6">
<div class="card p-4">
<h5 class="mb-4">Chinh sua cong viec</h5>
<form method="POST">
<div class="mb-3">
<label class="form-label">Tieu de *</label>
<input type="text" name="title" class="form-control" value="{{ task.title }}" required>
</div>
<div class="mb-3">
<label class="form-label">Mo ta</label>
<textarea name="description" class="form-control" rows="3">{{ task.description }}</textarea>
</div>
<div class="mb-3">
<label class="form-label">Do uu tien</label>
<select name="priority" class="form-select">
<option value="low" {% if task.priority=='low' %}selected{% endif %}>Thap</option>
<option value="medium" {% if task.priority=='medium' %}selected{% endif %}>Trung binh</option>
<option value="high" {% if task.priority=='high' %}selected{% endif %}>Cao</option>
</select>
</div>
<div class="mb-4">
<label class="form-label">Trang thai</label>
<select name="status" class="form-select">
<option value="pending" {% if task.status=='pending' %}selected{% endif %}>Dang lam</option>
<option value="done" {% if task.status=='done' %}selected{% endif %}>Hoan thanh</option>
</select>
</div>
<div class="d-flex gap-2">
<button type="submit" class="btn btn-primary">Cap nhat</button>
<a href="{{ url_for('tasks') }}" class="btn btn-outline-secondary">Huy</a>
</div>
</form>
</div>
</div>
</div>
{% endblock %}
